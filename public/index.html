<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <div class="top">
        <h2>Sea<span>rch</span><b>!</b></h2>
        <form action="" class="searchForm">
          <img src="../images/icon-1.png" alt="" />
          <input type="text" class="searchBox" placeholder="search..." />
          <button class="cut" hidden><i class="fa-solid fa-xmark"></i></button>
          <button class="searchBtn" type="submit">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </form>
      </div>

      <div class="display">
        <div class="results">
          <p></p>
        </div>

        <div class="chatBot-container">
          <h2><i class="fa-solid fa-robot"></i> AI Chat!</h2>
          <div class="chat-body"></div>
          <div class="chat-controls">
            <input
              type="text"
              class="chat-input"
              placeholder="type to chat..."
            />
            <button class="chat-btn" onclick="sendMessage()" id="btn">
              <i class="fa-solid fa-paper-plane"></i>
            </button>
            <div class="upload-wrap">
              <input type="file" accept="images/*" class="img-upload" hidden />
              <i class="fa-solid fa-file-arrow-up"></i>
            </div>
          </div>
        </div>
        <div class="show-chatbot"><i class="fa-solid fa-message"></i></div>
        <div class="hide-chatbot" hidden>
          <i class="fa-solid fa-xmark hideCB X"></i>
        </div>
      </div>
    </div>
  </body>
</html>
